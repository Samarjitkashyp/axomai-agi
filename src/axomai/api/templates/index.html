<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AxomAI — Autonomous Intelligence</title>

  <!-- External libraries -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            appDark: '#0b0f19',
            surfaceDark: '#111827',
            cardDark: '#1e293b',
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b0f19;
      color: #f1f5f9;
      overflow: hidden;
    }

    /* Custom Modern Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.4);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(51, 65, 85, 0.6);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(71, 85, 105, 0.9);
    }

    /* Clean Markdown Styling */
    .markdown-body {
      color: #e2e8f0;
      line-height: 1.7;
    }
    .markdown-body p {
      margin-bottom: 0.85rem;
    }
    .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 {
      color: #f8fafc;
      font-weight: 700;
      margin-top: 1.4rem;
      margin-bottom: 0.6rem;
      letter-spacing: -0.01em;
    }
    .markdown-body h1 { font-size: 1.4rem; }
    .markdown-body h2 { font-size: 1.25rem; }
    .markdown-body h3 { font-size: 1.1rem; }
    .markdown-body h4 { font-size: 0.95rem; }

    .markdown-body ul, .markdown-body ol {
      margin-left: 1.4rem;
      margin-bottom: 0.85rem;
    }
    .markdown-body ul { list-style-type: disc; }
    .markdown-body ol { list-style-type: decimal; }
    .markdown-body li { margin-bottom: 0.35rem; }

    .markdown-body code {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(51, 65, 85, 0.6);
      padding: 0.15rem 0.4rem;
      border-radius: 0.375rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85em;
      color: #38bdf8;
    }

    .markdown-body pre {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 0.75rem;
      padding: 1rem;
      overflow-x: auto;
      margin: 1rem 0;
    }
    .markdown-body pre code {
      background: transparent;
      border: none;
      padding: 0;
      color: #e2e8f0;
    }

    .markdown-body table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      margin: 1.25rem 0;
      font-size: 0.875rem;
      border-radius: 0.5rem;
      overflow: hidden;
      border: 1px solid #334155;
    }
    .markdown-body th, .markdown-body td {
      padding: 0.65rem 0.9rem;
      text-align: left;
      border-bottom: 1px solid #1e293b;
    }
    .markdown-body th {
      background: #1e293b;
      color: #f8fafc;
      font-weight: 600;
    }
    .markdown-body tr:nth-child(even) {
      background: rgba(30, 41, 59, 0.4);
    }
    .markdown-body tr:last-child td {
      border-bottom: none;
    }

    .markdown-body a {
      color: #38bdf8;
      text-decoration: underline;
      text-underline-offset: 3px;
      font-weight: 600;
      transition: color 0.15s;
    }
    .markdown-body a:hover {
      color: #7dd3fc;
    }

    .markdown-body blockquote {
      border-left: 3px solid #38bdf8;
      padding-left: 1rem;
      margin: 1rem 0;
      color: #94a3b8;
      font-style: italic;
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col bg-appDark text-slate-100 antialiased select-none relative overflow-hidden">

  <!-- CINEMATIC 3D ROTATING REAL EARTH GLOBE BACKGROUND -->
  <canvas id="globe-canvas" class="fixed inset-0 w-full h-full pointer-events-none z-0"></canvas>
  <div class="fixed inset-0 bg-gradient-to-b from-[#0b0f19]/75 via-[#0b0f19]/45 to-[#0b0f19]/80 pointer-events-none z-0"></div>

  <!-- MINIMALIST PROFESSIONAL HEADER -->
  <header class="h-14 border-b border-slate-800/80 bg-surfaceDark/80 backdrop-blur-md px-5 flex items-center justify-between shrink-0 z-30 relative">
    
    <!-- Left: Identity & Status -->
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center shadow-md">
        <i data-lucide="sparkles" class="w-4 h-4 text-white"></i>
      </div>
      <div class="flex items-center gap-2">
        <span class="font-bold text-base tracking-tight text-white">AxomAI</span>
        <span class="px-1.5 py-0.5 rounded text-[10px] font-medium bg-sky-500/10 text-sky-400 border border-sky-500/20">Agentic</span>
      </div>
      <div class="flex items-center gap-1.5 pl-3 border-l border-slate-800 text-xs text-slate-400">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span class="text-[11px] text-slate-400 font-medium">Online</span>
      </div>
    </div>

    <!-- Right: Clean New Chat Action -->
    <div class="flex items-center gap-2">
      <button onclick="clearChatUI()" class="px-3.5 py-1.5 rounded-lg border border-slate-700/80 hover:border-slate-600 bg-cardDark/60 hover:bg-cardDark text-xs font-medium text-slate-200 transition-colors flex items-center gap-1.5" title="Start New Conversation">
        <i data-lucide="plus" class="w-3.5 h-3.5 text-slate-400"></i>
        <span>New Chat</span>
      </button>
    </div>
  </header>

  <!-- MAIN CENTERED CHAT WORKSPACE -->
  <main class="flex-1 flex flex-col items-center justify-between overflow-hidden relative w-full z-10">
    
    <!-- Messages Scroll Area (Centered, Max Width) -->
    <div id="chat-messages-container" class="flex-1 w-full max-w-3xl overflow-y-auto px-4 py-8 space-y-6">
      
      <!-- Clean Minimalist Welcome Hero (No Cards) -->
      <div id="welcome-hero" class="text-center py-20 space-y-4">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-sky-500/20 to-indigo-500/20 border border-sky-500/30 mx-auto flex items-center justify-center shadow-lg">
          <i data-lucide="sparkles" class="w-7 h-7 text-sky-400"></i>
        </div>
        <div class="space-y-2">
          <h1 class="text-2xl sm:text-3xl font-bold text-white tracking-tight">How can I help you today?</h1>
          <p class="text-sm text-slate-400 max-w-md mx-auto leading-relaxed">
            Autonomous intelligence for portal crawling, document downloads, OCR transcription, and enterprise analytics.
          </p>
        </div>
      </div>

    </div>

    <!-- Attached Files Bar (Centered) -->
    <div id="attached-files-bar" class="w-full max-w-3xl px-4 py-2 hidden">
      <div id="attached-files-chips" class="flex items-center gap-2.5 overflow-x-auto pb-1"></div>
    </div>

    <!-- Dialogue Input Bar (Floating Modern Pill) -->
    <div class="w-full max-w-3xl px-4 pb-6 pt-2 shrink-0">
      <form onsubmit="handleSendQueryForm(event)" class="relative flex items-center bg-cardDark/90 border border-slate-700/80 focus-within:border-sky-500/70 focus-within:ring-2 focus-within:ring-sky-500/20 rounded-2xl shadow-xl p-1.5 transition-all">
        
        <!-- File Attach Button -->
        <label class="p-2.5 rounded-xl text-slate-400 hover:text-sky-400 hover:bg-slate-700/50 cursor-pointer transition-colors flex items-center justify-center shrink-0" title="Attach Files (Code, Documents, Images, Data)">
          <i data-lucide="paperclip" class="w-4 h-4"></i>
          <input type="file" id="chat-file-input" class="hidden" multiple onchange="handleFileInputChange(event)" accept="*">
        </label>

        <!-- Query Input -->
        <input 
          type="text" 
          id="user-query-input" 
          placeholder="Ask anything, enter a website URL, or attach a document..." 
          class="flex-1 bg-transparent border-0 px-3 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-0"
          autocomplete="off"
        />

        <!-- Send Action Button -->
        <button 
          type="submit" 
          id="send-query-btn"
          class="p-2.5 rounded-xl bg-sky-500 hover:bg-sky-400 text-slate-950 font-semibold transition-all flex items-center justify-center shrink-0 shadow-md hover:shadow-sky-500/20"
          title="Send Command"
        >
          <i data-lucide="arrow-up" class="w-4 h-4 stroke-[2.5]"></i>
        </button>
      </form>
      <p class="text-center text-[11px] text-slate-500 mt-2">
        AxomAI browses live portals, extracts documents & OCR, and synthesizes downloadable reports.
      </p>
    </div>

  </main>

  <!-- JAVASCRIPT APPLICATION LOGIC & CINEMATIC 3D GLOBE -->
  <script>
    // State
    const currentSessionId = 'sess-' + Math.random().toString(36).substring(2, 9);
    let attachedFiles = [];

    // Initialize UI and 3D Globe
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      initCinematicGlobe();
    });

    // =========================================================================
    // PHOTOREALISTIC 3D ROTATING REAL EARTH WITH COUNTRY ARCS & PULSES
    // =========================================================================
    function initCinematicGlobe() {
      const canvas = document.getElementById('globe-canvas');
      if (!canvas || typeof THREE === 'undefined') return;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 3000);
      camera.position.z = 370;

      const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      // Realistic Space Lighting (Soft Sun + Deep Ambient)
      const sunLight = new THREE.DirectionalLight(0xffffff, 1.25);
      sunLight.position.set(380, 160, 240);
      scene.add(sunLight);

      const ambientLight = new THREE.AmbientLight(0x0f172a, 0.35);
      scene.add(ambientLight);

      const globeGroup = new THREE.Group();
      scene.add(globeGroup);

      const radius = 125;
      const textureLoader = new THREE.TextureLoader();

      // 1. Real Satellite Earth Texture with Night City Lights
      const earthTex = textureLoader.load('/static/textures/earth_blue_marble.jpg');
      const nightTex = textureLoader.load('/static/textures/earth_night.jpg');
      const earthGeo = new THREE.SphereGeometry(radius, 64, 64);
      const earthMat = new THREE.MeshStandardMaterial({
        map: earthTex,
        emissiveMap: nightTex,
        emissive: new THREE.Color(0xffe8c8),
        emissiveIntensity: 0.42,
        roughness: 0.65,
        metalness: 0.08
      });
      const earthMesh = new THREE.Mesh(earthGeo, earthMat);
      globeGroup.add(earthMesh);

      // 2. Realistic Swirling Atmospheric Cloud Layer
      const cloudsTex = textureLoader.load('/static/textures/earth_clouds.png');
      const cloudsGeo = new THREE.SphereGeometry(radius * 1.018, 64, 64);
      const cloudsMat = new THREE.MeshStandardMaterial({
        map: cloudsTex,
        transparent: true,
        opacity: 0.40,
        blending: THREE.AdditiveBlending
      });
      const cloudsMesh = new THREE.Mesh(cloudsGeo, cloudsMat);
      globeGroup.add(cloudsMesh);

      // 3. Atmospheric Outer Rim Glow (Rayleigh Halo)
      const atmoGeo = new THREE.SphereGeometry(radius * 1.08, 64, 64);
      const atmoMat = new THREE.ShaderMaterial({
        vertexShader: `
          varying vec3 vNormal;
          void main() {
            vNormal = normalize(normalMatrix * normal);
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          varying vec3 vNormal;
          void main() {
            float intensity = pow(0.66 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 2.0);
            gl_FragColor = vec4(0.24, 0.68, 1.0, 1.0) * intensity * 0.90;
          }
        `,
        blending: THREE.AdditiveBlending,
        side: THREE.BackSide,
        transparent: true
      });
      globeGroup.add(new THREE.Mesh(atmoGeo, atmoMat));

      // 4. Latitude & Longitude to 3D Cartesian Coordinates Converter
      function latLngToVec3(lat, lng, r) {
        const phi = (90 - lat) * (Math.PI / 180);
        const theta = (lng + 180) * (Math.PI / 180);
        const x = -r * Math.sin(phi) * Math.cos(theta);
        const z = r * Math.sin(phi) * Math.sin(theta);
        const y = r * Math.cos(phi);
        return new THREE.Vector3(x, y, z);
      }

      // 5. 24 Global City & Country Hubs
      const cities = [
        // India (High Priority Hubs)
        { name: 'Guwahati, Assam', lat: 26.14, lng: 91.73 },
        { name: 'New Delhi, India', lat: 28.61, lng: 77.20 },
        { name: 'Mumbai, India', lat: 19.07, lng: 72.87 },
        { name: 'Bengaluru, India', lat: 12.97, lng: 77.59 },
        { name: 'Kolkata, India', lat: 22.57, lng: 88.36 },
        // Asia & Middle East
        { name: 'Singapore', lat: 1.35, lng: 103.82 },
        { name: 'Tokyo, Japan', lat: 35.67, lng: 139.65 },
        { name: 'Dubai, UAE', lat: 25.20, lng: 55.27 },
        { name: 'Seoul, South Korea', lat: 37.56, lng: 126.97 },
        { name: 'Shanghai, China', lat: 31.23, lng: 121.47 },
        // Europe
        { name: 'London, UK', lat: 51.50, lng: -0.12 },
        { name: 'Frankfurt, Germany', lat: 50.11, lng: 8.68 },
        { name: 'Paris, France', lat: 48.85, lng: 2.35 },
        { name: 'Zurich, Switzerland', lat: 47.37, lng: 8.54 },
        // Americas
        { name: 'New York, USA', lat: 40.71, lng: -74.00 },
        { name: 'San Francisco, USA', lat: 37.77, lng: -122.41 },
        { name: 'Chicago, USA', lat: 41.87, lng: -87.62 },
        { name: 'Toronto, Canada', lat: 43.65, lng: -79.38 },
        { name: 'Sao Paulo, Brazil', lat: -23.55, lng: -46.63 },
        // Australia & Oceania
        { name: 'Sydney, Australia', lat: -33.86, lng: 151.20 },
        { name: 'Melbourne, Australia', lat: -37.81, lng: 144.96 },
        // Africa
        { name: 'Cairo, Egypt', lat: 30.04, lng: 31.23 },
        { name: 'Cape Town, South Africa', lat: -33.92, lng: 18.42 },
        { name: 'Nairobi, Kenya', lat: -1.29, lng: 36.82 }
      ];

      const cityMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
      const pulseRings = [];

      cities.forEach(c => {
        const pos = latLngToVec3(c.lat, c.lng, radius * 1.003);
        
        // City Dot Pin
        const pin = new THREE.Mesh(new THREE.SphereGeometry(1.6, 8, 8), cityMat);
        pin.position.copy(pos);
        globeGroup.add(pin);

        // Expanding Pulse Ring
        const ringGeo = new THREE.RingGeometry(1.8, 3.2, 16);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.75, side: THREE.DoubleSide });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.position.copy(pos);
        ring.lookAt(pos.clone().multiplyScalar(2));
        globeGroup.add(ring);
        pulseRings.push({ mesh: ring, scale: 1.0, opacity: 0.75 });
      });

      // 6. Cross-Continental Flight Arcs (18 Global Routes)
      const connections = [
        [0, 1],  // Guwahati -> Delhi
        [0, 4],  // Guwahati -> Kolkata
        [1, 2],  // Delhi -> Mumbai
        [2, 3],  // Mumbai -> Bengaluru
        [0, 5],  // Guwahati -> Singapore
        [3, 5],  // Bengaluru -> Singapore
        [1, 7],  // Delhi -> Dubai
        [7, 11], // Dubai -> Frankfurt
        [11, 10],// Frankfurt -> London
        [10, 12],// London -> Paris
        [10, 14],// London -> New York
        [14, 16],// New York -> Chicago
        [16, 15],// Chicago -> San Francisco
        [15, 6], // San Francisco -> Tokyo
        [6, 8],  // Tokyo -> Seoul
        [8, 9],  // Seoul -> Shanghai
        [9, 5],  // Shanghai -> Singapore
        [5, 19], // Singapore -> Sydney
        [14, 18],// New York -> Sao Paulo
        [7, 21], // Dubai -> Cairo
        [21, 23],// Cairo -> Nairobi
        [23, 22] // Nairobi -> Cape Town
      ];

      const arcMat = new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.45 });
      const beadMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const arcLightBeads = [];

      connections.forEach(([i1, i2], idx) => {
        const p1 = latLngToVec3(cities[i1].lat, cities[i1].lng, radius);
        const p2 = latLngToVec3(cities[i2].lat, cities[i2].lng, radius);

        const dist = p1.distanceTo(p2);
        const mid = p1.clone().add(p2).multiplyScalar(0.5);
        if (mid.length() > 0.001) {
          mid.normalize().multiplyScalar(radius + Math.min(dist * 0.38, 48));
        }

        const curve = new THREE.QuadraticBezierCurve3(p1, mid, p2);
        const curvePoints = curve.getPoints(45);
        const curveGeo = new THREE.BufferGeometry().setFromPoints(curvePoints);
        const line = new THREE.Line(curveGeo, arcMat);
        globeGroup.add(line);

        // Animated Travelling Pulse Photon along Arc
        const bead = new THREE.Mesh(new THREE.SphereGeometry(1.6, 8, 8), beadMat);
        globeGroup.add(bead);
        arcLightBeads.push({
          mesh: bead,
          curve: curve,
          speed: 0.003 + (idx % 4) * 0.001,
          t: (idx * 0.09) % 1.0
        });
      });

      // 7. Immersive Deep Space Universe: Multi-Depth Stars & Cosmic Dust
      // Layer A: Omnidirectional Deep Starfield (3,200 Stars)
      const starCount = 3200;
      const starGeo = new THREE.BufferGeometry();
      const starPositions = [];
      const starColors = [];

      for (let i = 0; i < starCount; i++) {
        const radiusDist = 420 + Math.random() * 2200;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos((Math.random() * 2) - 1);

        const x = radiusDist * Math.sin(phi) * Math.cos(theta);
        const y = radiusDist * Math.sin(phi) * Math.sin(theta);
        const z = radiusDist * Math.cos(phi);
        starPositions.push(x, y, z);

        // Stellar Spectral Classes: Crisp White, Sirius Blue, Golden Amber, Distant Nebula
        const rand = Math.random();
        if (rand < 0.52) {
          starColors.push(1.0, 1.0, 1.0); // Pure White
        } else if (rand < 0.74) {
          starColors.push(0.68, 0.88, 1.0); // Spectral B - Icy Blue
        } else if (rand < 0.89) {
          starColors.push(1.0, 0.92, 0.72); // Spectral G - Warm Sun Gold
        } else if (rand < 0.96) {
          starColors.push(1.0, 0.75, 0.65); // Spectral K - Amber Orange
        } else {
          starColors.push(0.82, 0.60, 1.0); // Deep Space Violet
        }
      }

      starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPositions, 3));
      starGeo.setAttribute('color', new THREE.Float32BufferAttribute(starColors, 3));

      const starMat = new THREE.PointsMaterial({
        size: 1.4,
        vertexColors: true,
        transparent: true,
        opacity: 0.82
      });
      const starsMesh = new THREE.Points(starGeo, starMat);
      scene.add(starsMesh);

      // Layer B: Distant Micro Cosmic Stellar Dust (1,500 Micro Dust Points)
      const dustGeo = new THREE.BufferGeometry();
      const dustPositions = [];
      const dustColors = [];
      for (let i = 0; i < 1500; i++) {
        const rDist = 320 + Math.random() * 1900;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos((Math.random() * 2) - 1);
        dustPositions.push(
          rDist * Math.sin(phi) * Math.cos(theta),
          rDist * Math.sin(phi) * Math.sin(theta),
          rDist * Math.cos(phi)
        );
        dustColors.push(0.65 + Math.random() * 0.3, 0.8 + Math.random() * 0.2, 1.0);
      }
      dustGeo.setAttribute('position', new THREE.Float32BufferAttribute(dustPositions, 3));
      dustGeo.setAttribute('color', new THREE.Float32BufferAttribute(dustColors, 3));

      const dustMat = new THREE.PointsMaterial({
        size: 0.9,
        vertexColors: true,
        transparent: true,
        opacity: 0.55
      });
      const dustMesh = new THREE.Points(dustGeo, dustMat);
      scene.add(dustMesh);

      // Layer C: Closer Foreground & Midground Stars (850 Stars close to Earth & Camera)
      const nearStarCount = 850;
      const nearStarGeo = new THREE.BufferGeometry();
      const nearStarPositions = [];
      const nearStarColors = [];

      for (let i = 0; i < nearStarCount; i++) {
        const radiusDist = 175 + Math.random() * 450;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos((Math.random() * 2) - 1);

        nearStarPositions.push(
          radiusDist * Math.sin(phi) * Math.cos(theta),
          radiusDist * Math.sin(phi) * Math.sin(theta),
          radiusDist * Math.cos(phi)
        );

        const rand = Math.random();
        if (rand < 0.6) {
          nearStarColors.push(1.0, 1.0, 1.0); // Bright White
        } else if (rand < 0.85) {
          nearStarColors.push(0.72, 0.92, 1.0); // Diamond Cyan
        } else {
          nearStarColors.push(1.0, 0.94, 0.75); // Radiant Gold
        }
      }

      nearStarGeo.setAttribute('position', new THREE.Float32BufferAttribute(nearStarPositions, 3));
      nearStarGeo.setAttribute('color', new THREE.Float32BufferAttribute(nearStarColors, 3));

      const nearStarMat = new THREE.PointsMaterial({
        size: 2.2,
        vertexColors: true,
        transparent: true,
        opacity: 0.88
      });
      const nearStarsMesh = new THREE.Points(nearStarGeo, nearStarMat);
      scene.add(nearStarsMesh);

      // 8. Photorealistic Orbiting Moon with High-Res NASA Texture & Smooth 64x64 Geometry
      const moonPivot = new THREE.Group();
      moonPivot.rotation.x = 0.25; // 14 degree orbital inclination
      moonPivot.rotation.z = 0.08;
      scene.add(moonPivot);

      const moonRadius = 33;
      const moonOrbitRadius = 245;
      const moonTex = textureLoader.load('/static/textures/moon_1024.jpg');
      const moonGeo = new THREE.SphereGeometry(moonRadius, 64, 64);
      const moonMat = new THREE.MeshStandardMaterial({
        map: moonTex,
        bumpMap: moonTex,
        bumpScale: 0.90,
        roughness: 0.88,
        metalness: 0.04
      });
      const moonMesh = new THREE.Mesh(moonGeo, moonMat);
      moonMesh.position.set(moonOrbitRadius, 0, 0);
      moonPivot.add(moonMesh);

      // Smooth Orbital Ellipse Guide Ring
      const orbitCurve = new THREE.EllipseCurve(0, 0, moonOrbitRadius, moonOrbitRadius, 0, 2 * Math.PI, false, 0);
      const orbitPts = orbitCurve.getPoints(128).map(p => new THREE.Vector3(p.x, 0, p.y));
      const orbitLine = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(orbitPts),
        new THREE.LineBasicMaterial({ color: 0x64748b, transparent: true, opacity: 0.18 })
      );
      moonPivot.add(orbitLine);

      // 9. Photorealistic Deep Space Asteroids (Scientific Craggy Chondrite Rock like Bennu/Ryugu)
      function createRealisticAsteroidGeometry(radius) {
        const geo = new THREE.IcosahedronGeometry(radius, 4);
        const pos = geo.attributes.position;
        const v = new THREE.Vector3();

        // 6 distinct impact craters carved across the asteroid surface
        const craters = [
          { dir: new THREE.Vector3(0.55, 0.65, 0.35).normalize(), r: radius * 0.48, depth: radius * 0.22 },
          { dir: new THREE.Vector3(-0.60, 0.25, -0.55).normalize(), r: radius * 0.52, depth: radius * 0.25 },
          { dir: new THREE.Vector3(0.20, -0.75, 0.40).normalize(), r: radius * 0.42, depth: radius * 0.20 },
          { dir: new THREE.Vector3(-0.70, -0.35, 0.30).normalize(), r: radius * 0.46, depth: radius * 0.24 },
          { dir: new THREE.Vector3(0.10, 0.35, -0.85).normalize(), r: radius * 0.44, depth: radius * 0.22 },
          { dir: new THREE.Vector3(0.80, -0.20, -0.30).normalize(), r: radius * 0.38, depth: radius * 0.18 }
        ];

        for (let i = 0; i < pos.count; i++) {
          v.fromBufferAttribute(pos, i);

          // 1. Asymmetrical oblong elongation (like Bennu / Ryugu photo)
          v.x *= 1.22;
          v.y *= 0.90;
          v.z *= 0.80;

          // 2. High-frequency rocky surface roughness (boulders, cliffs, ridges)
          const nx = Math.sin(v.x * 0.75) * Math.cos(v.y * 0.75);
          const ny = Math.sin(v.y * 1.35) * Math.cos(v.z * 1.35);
          const nz = Math.sin(v.z * 2.15) * Math.cos(v.x * 2.15);
          const rockNoise = (nx + ny + nz) * (radius * 0.085);

          // 3. Crater indentations with raised impact rims
          const dir = v.clone().normalize();
          let craterOffset = 0;
          craters.forEach(c => {
            const angle = dir.angleTo(c.dir);
            const dist = angle * radius;
            if (dist < c.r) {
              const factor = 1 - (dist / c.r);
              craterOffset -= Math.sin(factor * Math.PI * 0.5) * c.depth;
            } else if (dist < c.r * 1.25) {
              const rimFactor = 1 - ((dist - c.r) / (c.r * 0.25));
              craterOffset += rimFactor * (c.depth * 0.18);
            }
          });

          v.addScaledVector(dir, rockNoise + craterOffset);
          pos.setXYZ(i, v.x, v.y, v.z);
        }

        geo.computeVertexNormals();
        return geo;
      }

      const asteroidTex = textureLoader.load('/static/textures/asteroid_rock.jpg');
      const asteroidBump = textureLoader.load('/static/textures/asteroid_bump.jpg');
      const asteroidMat = new THREE.MeshStandardMaterial({
        map: asteroidTex,
        bumpMap: asteroidBump,
        bumpScale: 2.2,
        roughness: 0.92,
        metalness: 0.14,
        flatShading: true // Stark faceted boulder and cliff relief matching real space photos
      });

      // 8 Diverse Trajectories Across Earth & Outer Space
      const asteroidPaths = [
        // 1. Skimming northern atmospheric horizon of Earth
        { start: new THREE.Vector3(-340, 190, 85), end: new THREE.Vector3(340, -80, -45) },
        // 2. Front-facing transit across Earth's visible oceans/continents
        { start: new THREE.Vector3(-310, 135, 160), end: new THREE.Vector3(300, -125, 100) },
        // 3. Skimming southern polar rim of Earth
        { start: new THREE.Vector3(-330, -95, 75), end: new THREE.Vector3(320, 165, -65) },
        // 4. Reverse high-altitude diagonal transit
        { start: new THREE.Vector3(330, 180, 70), end: new THREE.Vector3(-330, -90, -50) },
        // 5. Eastern equatorial flyby
        { start: new THREE.Vector3(140, 220, 110), end: new THREE.Vector3(260, -210, -30) },
        // 6. Western horizon flyby
        { start: new THREE.Vector3(-270, 210, -40), end: new THREE.Vector3(-140, -220, 120) },
        // 7. Midground deep space transit behind Earth
        { start: new THREE.Vector3(-350, 60, -110), end: new THREE.Vector3(350, -40, -90) },
        // 8. Low diagonal crossing across viewport
        { start: new THREE.Vector3(-300, -160, 110), end: new THREE.Vector3(310, 140, 60) }
      ];

      // Reusable base geometries for diverse sizes (Large, Medium, Small)
      const geoLarge = createRealisticAsteroidGeometry(11.0);
      const geoMedium = createRealisticAsteroidGeometry(7.5);
      const geoSmall = createRealisticAsteroidGeometry(5.2);
      const baseGeos = [geoLarge, geoMedium, geoSmall];

      const asteroids = [];
      const asteroidCount = 8;

      for (let i = 0; i < asteroidCount; i++) {
        const aGroup = new THREE.Group();

        // Authentic Craggy Asteroid Mesh
        const chosenGeo = baseGeos[i % baseGeos.length];
        const rock = new THREE.Mesh(chosenGeo, asteroidMat);
        // Unique slight scale variation per asteroid
        const sx = 0.88 + Math.random() * 0.35;
        const sy = 0.88 + Math.random() * 0.35;
        const sz = 0.88 + Math.random() * 0.35;
        rock.scale.set(sx, sy, sz);
        aGroup.add(rock);

        // Subtle Escort of 12 Micro Regolith Pebble Fragments
        const debrisGeo = new THREE.BufferGeometry();
        const debrisPos = [];
        for (let j = 0; j < 12; j++) {
          const r = 10 + Math.random() * 8;
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos((Math.random() * 2) - 1);
          debrisPos.push(
            r * Math.sin(phi) * Math.cos(theta),
            r * Math.sin(phi) * Math.sin(theta),
            r * Math.cos(phi)
          );
        }
        debrisGeo.setAttribute('position', new THREE.Float32BufferAttribute(debrisPos, 3));
        const debrisMat = new THREE.PointsMaterial({
          size: 1.5,
          color: 0x9ca3af,
          transparent: true,
          opacity: 0.60
        });
        const debrisMesh = new THREE.Points(debrisGeo, debrisMat);
        aGroup.add(debrisMesh);

        scene.add(aGroup);

        const pathIdx = i % asteroidPaths.length;
        const path = asteroidPaths[pathIdx];

        asteroids.push({
          group: aGroup,
          rock: rock,
          debris: debrisMesh,
          progress: (i / asteroidCount), // Staggered initial positions so multiple asteroids are visible immediately
          speed: 0.00065 + (i % 4) * 0.00018, // Slow, majestic cinematic drift (~16-24s flyby)
          pathIndex: pathIdx,
          start: path.start.clone(),
          end: path.end.clone(),
          rotSpeed: {
            x: 0.0035 + (i % 3) * 0.0015,
            y: 0.0055 + (i % 2) * 0.0020,
            z: 0.0025 + (i % 4) * 0.0010
          }
        });
      }

      // Initial Cinematic Tilt
      globeGroup.rotation.x = 0.24;
      globeGroup.rotation.y = 1.35;

      // Handle Resize
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // 60FPS Animation Loop
      let clock = 0;
      function animate() {
        requestAnimationFrame(animate);
        clock += 0.015;

        // Slow smooth cinematic rotation
        globeGroup.rotation.y += 0.0012;

        // Atmospheric clouds drift independently over continents
        cloudsMesh.rotation.y += 0.00045;

        // Silky smooth Moon orbital rotation around Earth + synchronous axial spin
        moonPivot.rotation.y += 0.0022;
        moonMesh.rotation.y += 0.0022;

        // Realistic deep space cosmic drift & multi-layer twinkling
        starsMesh.rotation.y += 0.00008;
        starsMesh.rotation.x += 0.00003;
        dustMesh.rotation.y -= 0.00005;
        starMat.opacity = 0.72 + Math.sin(clock * 1.5) * 0.14;
        dustMat.opacity = 0.48 + Math.cos(clock * 1.2) * 0.12;

        // Foreground stars parallax drift & twinkle
        nearStarsMesh.rotation.y += 0.00022;
        nearStarsMesh.rotation.x += 0.00008;
        nearStarMat.opacity = 0.80 + Math.sin(clock * 2.2) * 0.16;

        // Animate country pulse rings
        pulseRings.forEach(p => {
          p.scale += 0.012;
          p.opacity -= 0.008;
          if (p.scale > 2.2) {
            p.scale = 1.0;
            p.opacity = 0.75;
          }
          p.mesh.scale.set(p.scale, p.scale, p.scale);
          p.mesh.material.opacity = Math.max(0, p.opacity);
        });

        // Animate travelling light pulses across country arcs
        arcLightBeads.forEach(b => {
          b.t += b.speed;
          if (b.t > 1.0) b.t = 0.0;
          const pt = b.curve.getPointAt(b.t);
          b.mesh.position.copy(pt);
        });

        // Animate multiple photorealistic asteroids drifting slowly and majestically past Earth
        asteroids.forEach(ast => {
          ast.progress += ast.speed;
          if (ast.progress >= 1.0) {
            ast.progress = 0.0;
            // Seamlessly cycle to next diverse trajectory
            ast.pathIndex = (ast.pathIndex + 1) % asteroidPaths.length;
            const nextPath = asteroidPaths[ast.pathIndex];
            ast.start.copy(nextPath.start);
            ast.end.copy(nextPath.end);
            ast.speed = 0.00065 + Math.random() * 0.00055;
          }

          const curPos = new THREE.Vector3().lerpVectors(ast.start, ast.end, ast.progress);
          ast.group.position.copy(curPos);

          // Slow, graceful chaotic multi-axis space tumble
          ast.rock.rotation.x += ast.rotSpeed.x;
          ast.rock.rotation.y += ast.rotSpeed.y;
          ast.rock.rotation.z += ast.rotSpeed.z;

          ast.debris.rotation.x += ast.rotSpeed.x * 0.7;
          ast.debris.rotation.y += ast.rotSpeed.y * 0.7;
        });

        renderer.render(scene, camera);
      }
      animate();
    }

    function formatFileSize(bytes) {
      if (!bytes || bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    function getFileIcon(filename) {
      const ext = (filename || '').split('.').pop().toLowerCase();
      const codeExts = ['py', 'js', 'jsx', 'ts', 'tsx', 'cpp', 'c', 'h', 'hpp', 'java', 'cs', 'go', 'rs', 'php', 'rb', 'html', 'css', 'sql', 'sh', 'bash', 'ps1', 'json', 'yaml', 'yml', 'toml', 'xml'];
      const tableExts = ['xlsx', 'xls', 'csv', 'tsv'];
      const imageExts = ['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg'];
      const pdfExts = ['pdf'];

      if (codeExts.includes(ext)) return 'code-2';
      if (tableExts.includes(ext)) return 'table';
      if (imageExts.includes(ext)) return 'image';
      if (pdfExts.includes(ext)) return 'file-text';
      return 'file';
    }

    function getFileBadgeColor(filename) {
      const ext = (filename || '').split('.').pop().toLowerCase();
      const codeExts = ['py', 'js', 'jsx', 'ts', 'tsx', 'cpp', 'c', 'h', 'hpp', 'java', 'cs', 'go', 'rs', 'php', 'rb', 'html', 'css', 'sql', 'sh', 'bash', 'ps1'];
      if (codeExts.includes(ext)) return 'bg-amber-500/10 text-amber-300 border-amber-500/30';
      if (ext === 'pdf') return 'bg-rose-500/10 text-rose-300 border-rose-500/30';
      if (['xlsx', 'xls', 'csv'].includes(ext)) return 'bg-emerald-500/10 text-emerald-300 border-emerald-500/30';
      if (['png', 'jpg', 'jpeg', 'webp'].includes(ext)) return 'bg-purple-500/10 text-purple-300 border-purple-500/30';
      return 'bg-sky-500/10 text-sky-300 border-sky-500/30';
    }

    async function uploadFilesBatch(files) {
      const bar = document.getElementById('attached-files-bar');
      const chips = document.getElementById('attached-files-chips');
      bar.classList.remove('hidden');

      for (const file of files) {
        const tempId = 'uploading-' + Math.random().toString(36).substring(2, 7);
        const tempDiv = document.createElement('div');
        tempDiv.id = tempId;
        tempDiv.className = 'flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-800/80 border border-sky-500/40 text-slate-300 text-xs shadow-sm animate-pulse shrink-0';
        tempDiv.innerHTML = `
          <i data-lucide="loader-2" class="w-3.5 h-3.5 text-sky-400 animate-spin"></i>
          <span class="truncate max-w-[120px] font-mono text-[11px]">${escapeHtml(file.name)}</span>
        `;
        chips.appendChild(tempDiv);
        lucide.createIcons();

        const formData = new FormData();
        formData.append('file', file);
        try {
          const res = await fetch('/api/upload', {
            method: 'POST',
            body: formData
          });
          const tempEl = document.getElementById(tempId);
          if (tempEl) tempEl.remove();

          if (res.ok) {
            const data = await res.json();
            const docId = data.id || data.document_id;
            const filename = data.filename || file.name;
            const fileSize = data.file_size || file.size || 0;
            const fileType = data.file_type || (filename.includes('.') ? filename.split('.').pop().toUpperCase() : 'FILE');
            attachedFiles.push({
              id: docId,
              title: filename,
              size: fileSize,
              type: fileType
            });
            renderAttachedFiles();
          } else {
            const errData = await res.json().catch(() => ({}));
            const errMsg = errData.detail || `Upload failed (Status ${res.status})`;
            console.error('File upload rejected by server:', errMsg);
            showUploadToast(file.name, errMsg);
            renderAttachedFiles();
          }
        } catch (err) {
          const tempEl = document.getElementById(tempId);
          if (tempEl) tempEl.remove();
          console.error('File upload network/runtime error:', err);
          showUploadToast(file.name, err.message || 'Network error occurred');
          renderAttachedFiles();
        }
      }
    }

    // Chat Execution
    async function handleSendQueryForm(e) {
      e.preventDefault();
      const input = document.getElementById('user-query-input');
      const query = input.value.trim();
      if (!query && !attachedFiles.length) return;

      const filesToSend = [...attachedFiles];
      attachedFiles = [];
      renderAttachedFiles();

      input.value = '';
      appendUserMessage(query, filesToSend);

      const responseCardId = 'msg-' + Math.random().toString(36).substring(2, 9);
      appendAssistantPlaceholder(responseCardId);

      try {
        const payload = {
          query: query || (filesToSend.length ? `Analyze the attached file: ${filesToSend[0].title}` : ''),
          session_id: currentSessionId,
          document_id: filesToSend.length ? filesToSend[0].id : null,
          document_ids: filesToSend.map(f => f.id),
          manual_agent: null
        };

        const res = await fetch('/api/master-stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const reader = res.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let fullAnswer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split('\n');

          for (const line of lines) {
            if (line.startsWith('data: ')) {
              try {
                const event = JSON.parse(line.substring(6));
                const evType = event.type || event.event;
                if (evType === 'status' && event.message && !fullAnswer) {
                  const body = document.getElementById(`${responseCardId}-body`);
                  if (body) {
                    body.innerHTML = `<span class="text-sky-400 font-medium flex items-center gap-2"><i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> ${escapeHtml(event.message)}</span>`;
                    lucide.createIcons();
                  }
                } else if (evType === 'token' && event.content) {
                  fullAnswer += event.content;
                  updateAssistantContent(responseCardId, fullAnswer);
                } else if ((evType === 'final' || evType === 'done') && (event.answer || event.content || fullAnswer)) {
                  fullAnswer = event.answer || event.content || fullAnswer;
                  updateAssistantContent(responseCardId, fullAnswer);
                } else if (evType === 'error' && event.error) {
                  updateAssistantContent(responseCardId, `**Notice:** ${event.error}`);
                }
              } catch (_) {}
            }
          }
        }
      } catch (err) {
        updateAssistantContent(responseCardId, `**System Notice:** ${err.message}`);
      }
    }

    function escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };

    }

        body.querySelectorAll('a').forEach(a => {
          const href = a.getAttribute('href') || '';
          if (href.startsWith('http') || href.startsWith('/api/download/')) {
            a.setAttribute('target', '_blank');
            if (href.includes('/download/')) {
              a.setAttribute('download', '');
            }
          }
        });
        const container = document.getElementById('chat-messages-container');
        container.scrollTop = container.scrollHeight;
        lucide.createIcons();
      }
    }

    function clearChatUI() {
      const container = document.getElementById('chat-messages-container');
      container.innerHTML = `
        <div id="welcome-hero" class="text-center py-20 space-y-4">
          <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-sky-500/20 to-indigo-500/20 border border-sky-500/30 mx-auto flex items-center justify-center shadow-lg">
            <i data-lucide="sparkles" class="w-7 h-7 text-sky-400"></i>
          </div>
          <div class="space-y-2">
            <h1 class="text-2xl sm:text-3xl font-bold text-white tracking-tight">How can I help you today?</h1>
            <p class="text-sm text-slate-400 max-w-md mx-auto leading-relaxed">
              Autonomous intelligence for portal crawling, document downloads, OCR transcription, and enterprise analytics.
            </p>
          </div>
        </div>
      `;
      attachedFiles = [];
      renderAttachedFiles();
      lucide.createIcons();
    }
  </script>
</body>
</html>
