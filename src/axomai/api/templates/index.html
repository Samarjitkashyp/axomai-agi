<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AxomAI — Autonomous Intelligence</title>

  <!-- External libraries -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            appDark: '#0b0f19',
            surfaceDark: '#111827',
            cardDark: '#1e293b',
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b0f19;
      color: #f1f5f9;
      overflow: hidden;
    }

    /* Custom Modern Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.4);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(51, 65, 85, 0.6);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(71, 85, 105, 0.9);
    }

    /* Clean Markdown Styling */
    .markdown-body {
      color: #e2e8f0;
      line-height: 1.7;
    }
    .markdown-body p {
      margin-bottom: 0.85rem;
    }
    .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 {
      color: #f8fafc;
      font-weight: 700;
      margin-top: 1.4rem;
      margin-bottom: 0.6rem;
      letter-spacing: -0.01em;
    }
    .markdown-body h1 { font-size: 1.4rem; }
    .markdown-body h2 { font-size: 1.25rem; }
    .markdown-body h3 { font-size: 1.1rem; }
    .markdown-body h4 { font-size: 0.95rem; }

    .markdown-body ul, .markdown-body ol {
      margin-left: 1.4rem;
      margin-bottom: 0.85rem;
    }
    .markdown-body ul { list-style-type: disc; }
    .markdown-body ol { list-style-type: decimal; }
    .markdown-body li { margin-bottom: 0.35rem; }

    .markdown-body code {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(51, 65, 85, 0.6);
      padding: 0.15rem 0.4rem;
      border-radius: 0.375rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85em;
      color: #38bdf8;
    }

    .markdown-body pre {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 0.75rem;
      padding: 1rem;
      overflow-x: auto;
      margin: 1rem 0;
    }
    .markdown-body pre code {
      background: transparent;
      border: none;
      padding: 0;
      color: #e2e8f0;
    }

    .markdown-body table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      margin: 1.25rem 0;
      font-size: 0.875rem;
      border-radius: 0.5rem;
      overflow: hidden;
      border: 1px solid #334155;
    }
    .markdown-body th, .markdown-body td {
      padding: 0.65rem 0.9rem;
      text-align: left;
      border-bottom: 1px solid #1e293b;
    }
    .markdown-body th {
      background: #1e293b;
      color: #f8fafc;
      font-weight: 600;
    }
    .markdown-body tr:nth-child(even) {
      background: rgba(30, 41, 59, 0.4);
    }
    .markdown-body tr:last-child td {
      border-bottom: none;
    }

    .markdown-body a {
      color: #38bdf8;
      text-decoration: underline;
      text-underline-offset: 3px;
      font-weight: 600;
      transition: color 0.15s;
    }
    .markdown-body a:hover {
      color: #7dd3fc;
    }

    .markdown-body blockquote {
      border-left: 3px solid #38bdf8;
      padding-left: 1rem;
      margin: 1rem 0;
      color: #94a3b8;
      font-style: italic;
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col bg-appDark text-slate-100 antialiased select-none relative overflow-hidden">

  <!-- CINEMATIC 3D ROTATING EARTH GLOBE BACKGROUND -->
  <canvas id="globe-canvas" class="fixed inset-0 w-full h-full pointer-events-none z-0"></canvas>
  <div class="fixed inset-0 bg-gradient-to-b from-[#0b0f19]/80 via-[#0b0f19]/55 to-[#0b0f19]/90 pointer-events-none z-0"></div>

  <!-- MINIMALIST PROFESSIONAL HEADER -->
  <header class="h-14 border-b border-slate-800/80 bg-surfaceDark/80 backdrop-blur-md px-5 flex items-center justify-between shrink-0 z-30 relative">
    
    <!-- Left: Identity & Status -->
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center shadow-md">
        <i data-lucide="sparkles" class="w-4 h-4 text-white"></i>
      </div>
      <div class="flex items-center gap-2">
        <span class="font-bold text-base tracking-tight text-white">AxomAI</span>
        <span class="px-1.5 py-0.5 rounded text-[10px] font-medium bg-sky-500/10 text-sky-400 border border-sky-500/20">Agentic</span>
      </div>
      <div class="flex items-center gap-1.5 pl-3 border-l border-slate-800 text-xs text-slate-400">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span class="text-[11px] text-slate-400 font-medium">Online</span>
      </div>
    </div>

    <!-- Right: Clean New Chat Action -->
    <div class="flex items-center gap-2">
      <button onclick="clearChatUI()" class="px-3.5 py-1.5 rounded-lg border border-slate-700/80 hover:border-slate-600 bg-cardDark/60 hover:bg-cardDark text-xs font-medium text-slate-200 transition-colors flex items-center gap-1.5" title="Start New Conversation">
        <i data-lucide="plus" class="w-3.5 h-3.5 text-slate-400"></i>
        <span>New Chat</span>
      </button>
    </div>
  </header>

  <!-- MAIN CENTERED CHAT WORKSPACE -->
  <main class="flex-1 flex flex-col items-center justify-between overflow-hidden relative w-full z-10">
    
    <!-- Messages Scroll Area (Centered, Max Width) -->
    <div id="chat-messages-container" class="flex-1 w-full max-w-3xl overflow-y-auto px-4 py-8 space-y-6">
      
      <!-- Clean Minimalist Welcome Hero (No Cards) -->
      <div id="welcome-hero" class="text-center py-20 space-y-4">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-sky-500/20 to-indigo-500/20 border border-sky-500/30 mx-auto flex items-center justify-center shadow-lg">
          <i data-lucide="sparkles" class="w-7 h-7 text-sky-400"></i>
        </div>
        <div class="space-y-2">
          <h1 class="text-2xl sm:text-3xl font-bold text-white tracking-tight">How can I help you today?</h1>
          <p class="text-sm text-slate-400 max-w-md mx-auto leading-relaxed">
            Autonomous intelligence for portal crawling, document downloads, OCR transcription, and enterprise analytics.
          </p>
        </div>
      </div>

    </div>

    <!-- Attached Files Bar (Centered) -->
    <div id="attached-files-bar" class="w-full max-w-3xl px-4 py-1.5 flex items-center gap-2 overflow-x-auto hidden">
      <span class="text-xs font-medium text-slate-400">Attached:</span>
      <div id="attached-files-chips" class="flex items-center gap-2"></div>
    </div>

    <!-- Dialogue Input Bar (Floating Modern Pill) -->
    <div class="w-full max-w-3xl px-4 pb-6 pt-2 shrink-0">
      <form onsubmit="handleSendQueryForm(event)" class="relative flex items-center bg-cardDark/90 border border-slate-700/80 focus-within:border-sky-500/70 focus-within:ring-2 focus-within:ring-sky-500/20 rounded-2xl shadow-xl p-1.5 transition-all">
        
        <!-- File Attach Button -->
        <label class="p-2.5 rounded-xl text-slate-400 hover:text-sky-400 hover:bg-slate-700/50 cursor-pointer transition-colors flex items-center justify-center shrink-0" title="Attach Document (PDF, Image, Excel, CSV)">
          <i data-lucide="paperclip" class="w-4 h-4"></i>
          <input type="file" id="chat-file-input" class="hidden" multiple onchange="handleFileInputChange(event)" accept=".pdf,.png,.jpg,.jpeg,.xlsx,.xls,.docx,.csv,.tsv,.txt,.md">
        </label>

        <!-- Query Input -->
        <input 
          type="text" 
          id="user-query-input" 
          placeholder="Ask anything, enter a website URL, or attach a document..." 
          class="flex-1 bg-transparent border-0 px-3 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-0"
          autocomplete="off"
        />

        <!-- Send Action Button -->
        <button 
          type="submit" 
          id="send-query-btn"
          class="p-2.5 rounded-xl bg-sky-500 hover:bg-sky-400 text-slate-950 font-semibold transition-all flex items-center justify-center shrink-0 shadow-md hover:shadow-sky-500/20"
          title="Send Command"
        >
          <i data-lucide="arrow-up" class="w-4 h-4 stroke-[2.5]"></i>
        </button>
      </form>
      <p class="text-center text-[11px] text-slate-500 mt-2">
        AxomAI browses live portals, extracts documents & OCR, and synthesizes downloadable reports.
      </p>
    </div>

  </main>

  <!-- JAVASCRIPT APPLICATION LOGIC & CINEMATIC 3D GLOBE -->
  <script>
    // State
    const currentSessionId = 'sess-' + Math.random().toString(36).substring(2, 9);
    let attachedFiles = [];

    // Initialize UI and 3D Globe
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      initCinematicGlobe();
    });

    // =========================================================================
    // CINEMATIC 3D ROTATING EARTH GLOBE WITH COUNTRY ARCS & PULSES
    // =========================================================================
    function initCinematicGlobe() {
      const canvas = document.getElementById('globe-canvas');
      if (!canvas || typeof THREE === 'undefined') return;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
      camera.position.z = 380;

      const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      const globeGroup = new THREE.Group();
      scene.add(globeGroup);

      const radius = 130;

      // 1. Dark Base Sphere
      const coreGeo = new THREE.SphereGeometry(radius * 0.98, 48, 48);
      const coreMat = new THREE.MeshBasicMaterial({ color: 0x070c17 });
      const coreSphere = new THREE.Mesh(coreGeo, coreMat);
      globeGroup.add(coreSphere);

      // 2. Latitude & Longitude Rings
      const gridMat = new THREE.LineBasicMaterial({ color: 0x1e3a5f, transparent: true, opacity: 0.22 });
      for (let lat = -60; lat <= 60; lat += 20) {
        const r = radius * Math.cos(lat * Math.PI / 180);
        const y = radius * Math.sin(lat * Math.PI / 180);
        const ringGeo = new THREE.BufferGeometry();
        const pts = [];
        for (let i = 0; i <= 64; i++) {
          const theta = (i / 64) * Math.PI * 2;
          pts.push(new THREE.Vector3(r * Math.cos(theta), y, r * Math.sin(theta)));
        }
        ringGeo.setFromPoints(pts);
        globeGroup.add(new THREE.Line(ringGeo, gridMat));
      }
      for (let lng = 0; lng < 180; lng += 30) {
        const ringGeo = new THREE.BufferGeometry();
        const pts = [];
        const rad = lng * Math.PI / 180;
        for (let i = 0; i <= 64; i++) {
          const theta = (i / 64) * Math.PI * 2;
          const x = radius * Math.sin(theta) * Math.cos(rad);
          const y = radius * Math.cos(theta);
          const z = radius * Math.sin(theta) * Math.sin(rad);
          pts.push(new THREE.Vector3(x, y, z));
        }
        ringGeo.setFromPoints(pts);
        globeGroup.add(new THREE.Line(ringGeo, gridMat));
      }

      // 3. Dot Matrix Points across Continents
      const dotCount = 1400;
      const dotGeo = new THREE.BufferGeometry();
      const dotPositions = [];
      for (let i = 0; i < dotCount; i++) {
        const phi = Math.acos(-1 + (2 * i) / dotCount);
        const theta = Math.sqrt(dotCount * Math.PI) * phi;
        const lat = 90 - (phi * 180 / Math.PI);
        const lng = (theta * 180 / Math.PI) % 360 - 180;

        // Approximate real continents distribution
        const isLand = (
          (lat > 5 && lat < 70 && lng > -10 && lng < 150) ||   // Eurasia
          (lat > -35 && lat < 38 && lng > -20 && lng < 55) ||  // Africa
          (lat > 15 && lat < 72 && lng > -165 && lng < -50) || // North America
          (lat > -55 && lat < 12 && lng > -85 && lng < -35) || // South America
          (lat > -45 && lat < -10 && lng > 110 && lng < 155)   // Australia
        );

        if (isLand || Math.random() < 0.12) {
          const x = -radius * Math.sin(phi) * Math.cos(theta);
          const y = radius * Math.cos(phi);
          const z = radius * Math.sin(phi) * Math.sin(theta);
          dotPositions.push(x, y, z);
        }
      }
      dotGeo.setAttribute('position', new THREE.Float32BufferAttribute(dotPositions, 3));
      const dotMat = new THREE.PointsMaterial({ color: 0x38bdf8, size: 1.5, transparent: true, opacity: 0.5 });
      globeGroup.add(new THREE.Points(dotGeo, dotMat));

      // 4. Coordinates Converter
      function latLngToVec3(lat, lng, r) {
        const phi = (90 - lat) * (Math.PI / 180);
        const theta = (lng + 180) * (Math.PI / 180);
        const x = -r * Math.sin(phi) * Math.cos(theta);
        const z = r * Math.sin(phi) * Math.sin(theta);
        const y = r * Math.cos(phi);
        return new THREE.Vector3(x, y, z);
      }

      // 5. Strategic Global Country Nodes
      const cities = [
        { name: 'Guwahati, India', lat: 26.14, lng: 91.73 },
        { name: 'New Delhi, India', lat: 28.61, lng: 77.20 },
        { name: 'Singapore', lat: 1.35, lng: 103.82 },
        { name: 'Tokyo, Japan', lat: 35.67, lng: 139.65 },
        { name: 'Dubai, UAE', lat: 25.20, lng: 55.27 },
        { name: 'London, UK', lat: 51.50, lng: -0.12 },
        { name: 'Frankfurt, Germany', lat: 50.11, lng: 8.68 },
        { name: 'New York, USA', lat: 40.71, lng: -74.00 },
        { name: 'San Francisco, USA', lat: 37.77, lng: -122.41 },
        { name: 'Sydney, Australia', lat: -33.86, lng: 151.20 }
      ];

      const cityMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
      const pulseRings = [];

      cities.forEach(c => {
        const pos = latLngToVec3(c.lat, c.lng, radius * 1.002);
        
        // City Dot
        const pin = new THREE.Mesh(new THREE.SphereGeometry(1.6, 8, 8), cityMat);
        pin.position.copy(pos);
        globeGroup.add(pin);

        // Expanding Pulsing Ring
        const ringGeo = new THREE.RingGeometry(1.8, 2.8, 16);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.7, side: THREE.DoubleSide });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.position.copy(pos);
        ring.lookAt(pos.clone().multiplyScalar(2));
        globeGroup.add(ring);
        pulseRings.push({ mesh: ring, scale: 1.0, opacity: 0.7 });
      });

      // 6. 3D Flight Arcs Connecting Countries
      const connections = [
        [0, 1], // Guwahati -> Delhi
        [0, 2], // Guwahati -> Singapore
        [1, 4], // Delhi -> Dubai
        [4, 6], // Dubai -> Frankfurt
        [6, 5], // Frankfurt -> London
        [5, 7], // London -> New York
        [7, 8], // New York -> San Francisco
        [8, 3], // San Francisco -> Tokyo
        [3, 2], // Tokyo -> Singapore
        [2, 9]  // Singapore -> Sydney
      ];

      const arcMat = new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.35 });
      const beadMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const arcLightBeads = [];

      connections.forEach(([i1, i2], idx) => {
        const p1 = latLngToVec3(cities[i1].lat, cities[i1].lng, radius);
        const p2 = latLngToVec3(cities[i2].lat, cities[i2].lng, radius);

        const dist = p1.distanceTo(p2);
        const mid = p1.clone().add(p2).multiplyScalar(0.5);
        if (mid.length() > 0.001) {
          mid.normalize().multiplyScalar(radius + Math.min(dist * 0.38, 45));
        }

        const curve = new THREE.QuadraticBezierCurve3(p1, mid, p2);
        const curvePoints = curve.getPoints(40);
        const curveGeo = new THREE.BufferGeometry().setFromPoints(curvePoints);
        const line = new THREE.Line(curveGeo, arcMat);
        globeGroup.add(line);

        // Animated Travelling Pulse Photon along Arc
        const bead = new THREE.Mesh(new THREE.SphereGeometry(1.5, 8, 8), beadMat);
        globeGroup.add(bead);
        arcLightBeads.push({
          mesh: bead,
          curve: curve,
          speed: 0.0035 + (idx % 3) * 0.0012,
          t: (idx * 0.11) % 1.0
        });
      });

      // 7. Ambient Twinkling Stars in Background
      const starCount = 300;
      const starGeo = new THREE.BufferGeometry();
      const starPositions = [];
      for (let i = 0; i < starCount; i++) {
        const x = (Math.random() - 0.5) * 1200;
        const y = (Math.random() - 0.5) * 1200;
        const z = (Math.random() - 0.5) * 800 - 100;
        starPositions.push(x, y, z);
      }
      starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPositions, 3));
      const starMat = new THREE.PointsMaterial({ color: 0x94a3b8, size: 1.2, transparent: true, opacity: 0.35 });
      scene.add(new THREE.Points(starGeo, starMat));

      // 8. Soft Atmosphere Glow Outer Shell
      const atmoGeo = new THREE.SphereGeometry(radius * 1.07, 48, 48);
      const atmoMat = new THREE.MeshBasicMaterial({ color: 0x0284c7, transparent: true, opacity: 0.05, side: THREE.BackSide });
      globeGroup.add(new THREE.Mesh(atmoGeo, atmoMat));

      // Initial Cinematic Tilt
      globeGroup.rotation.x = 0.22;
      globeGroup.rotation.y = 1.2;

      // Handle Resize
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // 60FPS Animation Loop
      function animate() {
        requestAnimationFrame(animate);

        // Slow smooth cinematic rotation
        globeGroup.rotation.y += 0.0012;

        // Animate country pulse rings
        pulseRings.forEach(p => {
          p.scale += 0.012;
          p.opacity -= 0.008;
          if (p.scale > 2.2) {
            p.scale = 1.0;
            p.opacity = 0.7;
          }
          p.mesh.scale.set(p.scale, p.scale, p.scale);
          p.mesh.material.opacity = Math.max(0, p.opacity);
        });

        // Animate travelling light pulses across country arcs
        arcLightBeads.forEach(b => {
          b.t += b.speed;
          if (b.t > 1.0) b.t = 0.0;
          const pt = b.curve.getPointAt(b.t);
          b.mesh.position.copy(pt);
        });

        renderer.render(scene, camera);
      }
      animate();
    }

    // =========================================================================
    // CHAT & FILE ATTACHMENT APPLICATION LOGIC
    // =========================================================================
    function handleFileInputChange(e) {
      if (e.target.files && e.target.files.length) {
        uploadFilesBatch(e.target.files);
      }
    }

    async function uploadFilesBatch(files) {
      for (const file of files) {
        const formData = new FormData();
        formData.append('file', file);
        try {
          const res = await fetch('/api/upload', {
            method: 'POST',
            body: formData
          });
          if (res.ok) {
            const data = await res.json();
            attachedFiles.push({ id: data.id, title: data.filename });
            renderAttachedFiles();
          }
        } catch (err) {
          console.error('File upload failed:', err);
        }
      }
    }

    function renderAttachedFiles() {
      const bar = document.getElementById('attached-files-bar');
      const chips = document.getElementById('attached-files-chips');
      if (!attachedFiles.length) {
        bar.classList.add('hidden');
        chips.innerHTML = '';
        return;
      }
      bar.classList.remove('hidden');
      chips.innerHTML = attachedFiles.map((f, i) => `
        <span class="px-2.5 py-1 rounded-lg bg-cardDark border border-slate-700 text-xs font-medium text-sky-300 flex items-center gap-1.5">
          <span>${escapeHtml(f.title)}</span>
          <button type="button" onclick="removeAttachedFile(${i})" class="text-slate-400 hover:text-red-400">&times;</button>
        </span>
      `).join('');
    }

    function removeAttachedFile(index) {
      attachedFiles.splice(index, 1);
      renderAttachedFiles();
    }

    // Chat Execution
    async function handleSendQueryForm(e) {
      e.preventDefault();
      const input = document.getElementById('user-query-input');
      const query = input.value.trim();
      if (!query) return;

      input.value = '';
      appendUserMessage(query);

      const responseCardId = 'msg-' + Math.random().toString(36).substring(2, 9);
      appendAssistantPlaceholder(responseCardId);

      try {
        const payload = {
          query: query,
          session_id: currentSessionId,
          document_id: attachedFiles.length ? attachedFiles[0].id : null,
          document_ids: attachedFiles.map(f => f.id),
          manual_agent: null
        };

        const res = await fetch('/api/master-stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const reader = res.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let fullAnswer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split('\n');

          for (const line of lines) {
            if (line.startsWith('data: ')) {
              try {
                const event = JSON.parse(line.substring(6));
                const evType = event.type || event.event;
                if (evType === 'status' && event.message && !fullAnswer) {
                  const body = document.getElementById(`${responseCardId}-body`);
                  if (body) {
                    body.innerHTML = `<span class="text-sky-400 font-medium flex items-center gap-2"><i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> ${escapeHtml(event.message)}</span>`;
                    lucide.createIcons();
                  }
                } else if (evType === 'token' && event.content) {
                  fullAnswer += event.content;
                  updateAssistantContent(responseCardId, fullAnswer);
                } else if ((evType === 'final' || evType === 'done') && (event.answer || event.content || fullAnswer)) {
                  fullAnswer = event.answer || event.content || fullAnswer;
                  updateAssistantContent(responseCardId, fullAnswer);
                } else if (evType === 'error' && event.error) {
                  updateAssistantContent(responseCardId, `**Notice:** ${event.error}`);
                }
              } catch (_) {}
            }
          }
        }
      } catch (err) {
        updateAssistantContent(responseCardId, `**System Notice:** ${err.message}`);
      }
    }

    function escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return String(text).replace(/[&<>"']/g, m => map[m]);
    }

    function appendUserMessage(text) {
      const container = document.getElementById('chat-messages-container');
      const hero = document.getElementById('welcome-hero');
      if (hero) hero.classList.add('hidden');

      const div = document.createElement('div');
      div.className = 'flex justify-end';
      div.innerHTML = `
        <div class="max-w-xl p-3.5 px-4 rounded-2xl rounded-br-sm bg-sky-600 text-white text-sm leading-relaxed shadow-sm">
          ${escapeHtml(text)}
        </div>
      `;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
      lucide.createIcons();
    }

    function appendAssistantPlaceholder(id) {
      const container = document.getElementById('chat-messages-container');
      const hero = document.getElementById('welcome-hero');
      if (hero) hero.classList.add('hidden');

      const div = document.createElement('div');
      div.className = 'flex justify-start';
      div.innerHTML = `
        <div id="${id}" class="max-w-3xl w-full p-5 rounded-2xl bg-cardDark/90 border border-slate-700/70 text-slate-200 text-sm shadow-md space-y-3">
          <div class="flex items-center justify-between border-b border-slate-700/50 pb-2.5">
            <div class="flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-sky-400 animate-pulse"></span>
              <span class="text-xs font-bold text-sky-400">AxomAI</span>
            </div>
            <div class="text-[10px] text-slate-400 font-medium">Verified Response</div>
          </div>
          <div class="markdown-body font-sans text-sm leading-relaxed" id="${id}-body">
            <span class="text-slate-400 font-medium flex items-center gap-2">
              <i data-lucide="loader-2" class="w-4 h-4 animate-spin text-sky-400"></i> Processing instruction...
            </span>
          </div>
        </div>
      `;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
      lucide.createIcons();
    }

    function updateAssistantContent(id, text) {
      const body = document.getElementById(`${id}-body`);
      if (body) {
        body.innerHTML = marked.parse(text);
        body.querySelectorAll('a').forEach(a => {
          const href = a.getAttribute('href') || '';
          if (href.startsWith('http') || href.startsWith('/api/download/')) {
            a.setAttribute('target', '_blank');
            if (href.includes('/download/')) {
              a.setAttribute('download', '');
            }
          }
        });
        const container = document.getElementById('chat-messages-container');
        container.scrollTop = container.scrollHeight;
        lucide.createIcons();
      }
    }

    function clearChatUI() {
      const container = document.getElementById('chat-messages-container');
      container.innerHTML = `
        <div id="welcome-hero" class="text-center py-20 space-y-4">
          <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-sky-500/20 to-indigo-500/20 border border-sky-500/30 mx-auto flex items-center justify-center shadow-lg">
            <i data-lucide="sparkles" class="w-7 h-7 text-sky-400"></i>
          </div>
          <div class="space-y-2">
            <h1 class="text-2xl sm:text-3xl font-bold text-white tracking-tight">How can I help you today?</h1>
            <p class="text-sm text-slate-400 max-w-md mx-auto leading-relaxed">
              Autonomous intelligence for portal crawling, document downloads, OCR transcription, and enterprise analytics.
            </p>
          </div>
        </div>
      `;
      attachedFiles = [];
      renderAttachedFiles();
      lucide.createIcons();
    }
  </script>
</body>
</html>
